[package]
name = "otomat-rail"
version = "0.1.0"
description = "Otomat x402 settlement rail program"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "otomat_rail"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = { version = "0.31.1", features = ["token", "token_2022", "associated_token"] }
